    <script>
        window.Game = "Start";

        // Load from localStorage
        let savedWorldState = localStorage.getItem('iso_world_state');

        let updated = false;
        const updateInterval = setInterval(() => {
            if (typeof window.UpdateMap === 'function') {
                if (savedWorldState) {
                    window.UpdateMap(savedWorldState);
                    console.log("Xianxia JSON World Loaded from State.");
                } else {
                    console.log("No world state found. Waiting for AI initialization...");
                }
                updated = true;
                clearInterval(updateInterval);
            }
        }, 200);

        setTimeout(() => {
            if (!updated && typeof window.UpdateMap === 'function') {
                if (savedWorldState) window.UpdateMap(savedWorldState);
                clearInterval(updateInterval);
            }
        }, 2000);
    </script>
